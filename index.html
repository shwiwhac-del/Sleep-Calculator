    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">

        .initial-loader { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; color: #111827; }
        html.dark .initial-loader { background: #0f172a; color: #f3f4f6; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(37, 99, 235, 0.2); border-radius: 50%; border-top-color: #2563eb; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google tag (gtag.js) & Google AdSense - Deferred loading -->
    <script type="module">
      window.addEventListener("load", () => {
        const loadGA = () => {
          const script = document.createElement("script");
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-GS03RDZPNP";
          script.async = true;
          document.body.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          gtag("js", new Date());
          gtag("config", "G-GS03RDZPNP");
        };

        const loadAdSense = () => {
          const script = document.createElement("script");
          script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9951019772606987";
          script.async = true;
          script.crossOrigin = "anonymous";
          document.head.appendChild(script);
        };

        const loadDeferred = () => {
          loadGA();
          loadAdSense();
        };

        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadDeferred);
        } else {
          setTimeout(loadDeferred, 150);
        }
      });
    </script>
  </body>
