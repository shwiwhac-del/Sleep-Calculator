<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0b1120" />
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="clockGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Bottom Wave/Glow -->
  <path d="M 10 90 Q 30 75 50 85 T 90 90" fill="none" stroke="#0ea5e9" stroke-width="4" filter="url(#glow)" />
  <path d="M 10 91 Q 30 76 50 86 T 90 91" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Crescent Moon -->
  <path d="M 55 15 A 35 35 0 0 0 55 85 A 25 25 0 0 1 55 15 Z" fill="#e2e8f0" filter="url(#glow)" />
  <path d="M 55 15 A 35 35 0 0 0 55 85 A 25 25 0 0 1 55 15 Z" fill="#ffffff" />

  <!-- Glowing Clock -->
  <circle cx="55" cy="50" r="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" filter="url(#clockGlow)" />
  <circle cx="55" cy="50" r="16" fill="transparent" stroke="#38bdf8" stroke-width="1" />
  
  <!-- Clock tick marks -->
  <line x1="55" y1="37" x2="55" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="55" y1="63" x2="55" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="42" y1="50" x2="45" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="68" y1="50" x2="65" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Clock Hands -->
  <line x1="55" y1="50" x2="48" y2="45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="55" y1="50" x2="63" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="55" cy="50" r="2.5" fill="#ffffff" />

  <!-- Zzz -->
  <text x="62" y="38" fill="#ffffff" font-family="Verdana, sans-serif" font-size="8" font-weight="bold" transform="rotate(15 62 38)" filter="url(#glow)">Z</text>
  <text x="70" y="30" fill="#ffffff" font-family="Verdana, sans-serif" font-size="11" font-weight="bold" transform="rotate(15 70 30)" filter="url(#glow)">Z</text>
  <text x="80" y="21" fill="#ffffff" font-family="Verdana, sans-serif" font-size="14" font-weight="bold" transform="rotate(15 80 21)" filter="url(#glow)">Z</text>
</svg>