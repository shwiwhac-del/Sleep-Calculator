<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b253b" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#144285" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a0f18" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Gradients (3D effect) -->
    <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d0d5df" />
      <stop offset="100%" stop-color="#8a95a5" />
    </linearGradient>
    <linearGradient id="moonHighlight" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Neon Clock Glow -->
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bottom Wave Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  <!-- Underglow for clock -->
  <circle cx="55" cy="50" r="28" fill="url(#hubGlow)" />

  <!-- Bottom Glowing Waves -->
  <path d="M 0 85 Q 25 75 50 82 T 100 85 L 100 100 L 0 100 Z" fill="url(#waveGrad)" filter="url(#waveGlow)" opacity="0.6" />
  <path d="M 0 88 Q 30 78 55 86 T 100 88 L 100 100 L 0 100 Z" fill="#0055ff" filter="url(#neonBlur)" opacity="0.8" />
  <path d="M 0 92 Q 35 83 60 90 T 100 92" fill="none" stroke="#66b3ff" stroke-width="1.5" filter="url(#neonBlur)" />

  <!-- 3D Crescent Moon -->
  <!-- Outer shadow -->
  <path d="M 58 12 A 36 36 0 0 0 58 84 A 26 26 0 0 1 58 12 Z" fill="#000000" opacity="0.4" filter="blur(3px)" transform="translate(2, 3)" />
  <!-- Main body -->
  <path d="M 58 12 A 36 36 0 0 0 58 84 A 26 26 0 0 1 58 12 Z" fill="url(#moonBody)" filter="url(#dropShadow)" />
  <!-- Inner Highlight -->
  <path d="M 56 14 A 34 34 0 0 0 56 82 A 28 28 0 0 1 56 14 Z" fill="none" stroke="url(#moonHighlight)" stroke-width="1.5" />

  <!-- Neon Clock -->
  <!-- Outer ring -->
  <circle cx="56" cy="50" r="16" fill="none" stroke="#0055ff" stroke-width="2.5" filter="url(#strongNeon)" />
  <circle cx="56" cy="50" r="16" fill="none" stroke="#66b3ff" stroke-width="0.8" />
  
  <!-- Clock ticks -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#neonBlur)">
    <line x1="56" y1="36" x2="56" y2="39" />
    <line x1="56" y1="64" x2="56" y2="61" />
    <line x1="42" y1="50" x2="45" y2="50" />
    <line x1="70" y1="50" x2="67" y2="50" />
  </g>

  <!-- Clock Hands (10:10) -->
  <!-- Shadows for depth -->
  <line x1="56" y1="50" x2="49" y2="44" stroke="#000" stroke-width="2" stroke-linecap="round" transform="translate(0.5,1)" opacity="0.5"/>
  <line x1="56" y1="50" x2="65" y2="43" stroke="#000" stroke-width="2" stroke-linecap="round" transform="translate(0.5,1)" opacity="0.5"/>
  
  <line x1="56" y1="50" x2="49" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#neonBlur)" />
  <line x1="56" y1="50" x2="65" y2="43" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#neonBlur)" />
  
  <circle cx="56" cy="50" r="2.5" fill="#ffffff" filter="url(#neonBlur)" />

  <!-- Zzzs -->
  <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" filter="url(#dropShadow)">
    <text x="62" y="36" font-size="7" transform="rotate(10 62 36)">Z</text>
    <text x="70" y="28" font-size="10" transform="rotate(10 70 28)">Z</text>
    <text x="81" y="19" font-size="13" transform="rotate(10 81 19)">Z</text>
  </g>
</svg>