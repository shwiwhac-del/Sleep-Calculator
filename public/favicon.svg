<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container with rounded corner -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="8"/>
  
  <!-- Crescent Moon -->
  <path d="M 330 140 C 230 140 150 220 150 320 C 150 375 172 425 208 460 C 145 440 100 380 100 310 C 100 200 190 110 300 110 C 330 110 358 117 384 130 C 367 136 349 140 330 140 Z" fill="url(#moonGrad)" filter="url(#glow)"/>
  
  <!-- Sparkling Star 1 (Top Right) -->
  <path d="M 360 170 L 366 188 L 384 194 L 366 200 L 360 218 L 354 200 L 336 194 L 354 188 Z" fill="#FDE047"/>
  
  <!-- Sparkling Star 2 (Middle Right) -->
  <path d="M 400 270 L 404 282 L 416 286 L 404 290 L 400 302 L 396 290 L 384 286 L 396 282 Z" fill="#FDE047"/>
  
  <!-- Sparkling Star 3 (Bottom Left Small) -->
  <path d="M 180 190 L 183 198 L 191 201 L 183 204 L 180 212 L 177 204 L 169 201 L 177 198 Z" fill="#FDE047"/>
</svg>
